<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>TreeViz Connector</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header>
			<img src="icons/icon-32.png" width="32" height="32" alt="" />
			<div>
				<h1>TreeViz Connector</h1>
				<p class="brand">TreeViz - The Family Tree Visualiser &amp; Editor</p>
			</div>
			<label class="language">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path
						fill="currentColor"
						d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm7.93 9h-3.18a15.7 15.7 0 0 0-1.2-5.02A8.03 8.03 0 0 1 19.93 11ZM12 4c.9 1.2 1.7 2.9 2.16 5H9.84C10.3 6.9 11.1 5.2 12 4ZM4.07 13h3.18a15.7 15.7 0 0 0 1.2 5.02A8.03 8.03 0 0 1 4.07 13Zm3.18-2H4.07a8.03 8.03 0 0 1 4.38-5.02A15.7 15.7 0 0 0 7.25 11ZM12 20c-.9-1.2-1.7-2.9-2.16-5h4.32C13.7 17.1 12.9 18.8 12 20Zm2.75-7h-5.5a13.6 13.6 0 0 1 0-2h5.5a13.6 13.6 0 0 1 0 2Zm.55 7.02A15.7 15.7 0 0 0 16.75 13h3.18a8.03 8.03 0 0 1-4.63 7.02Z"
					/>
				</svg>
				<select id="language"></select>
			</label>
		</header>
		<main>
			<p id="status"></p>
			<ul id="trees"></ul>
			<button id="show" type="button"></button>
			<button id="check" type="button"></button>
			<button id="open" type="button"></button>
			<pre id="report" hidden></pre>
			<p id="note"></p>
		</main>
		<script type="module" src="dist/popup.js"></script>
	</body>
</html>
